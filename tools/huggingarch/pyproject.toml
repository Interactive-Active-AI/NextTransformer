[project]
name = "nexttransformer-huggingarch-tool"
version = "0.1.0"
description = "Optional HuggingArch analysis dependency, isolated from the pinned training stack"
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingarch @ git+https://github.com/shenh10/HuggingArch.git@facbbbc96856e558b9084a94a5070b2e2c86cf0b",
    "torch==2.9.1",
]

[tool.uv]
package = false

# The analysis tool does not need a GPU or CUDA runtime packages.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
