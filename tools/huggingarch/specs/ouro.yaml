# Fixed spec for custom:nextt-ouro-f2dd46b26bd0f0ce
# Scope: source evaluation: all max_loops=3 paths/codas/heads computed; token-wise exit_distribution quantile=.5 selection after full work
# Checkpoint unavailable; do not mark checkpoint_validated or valid true.
# Constants: backout_negative=-1; logit_div15=1/15; logit_mul15=15; inverse split-half RoPE theta=100000.
match:
  model_id:
  - custom:nextt-ouro-f2dd46b26bd0f0ce
  model_type:
  - nexttransformer_ouro
dims:
  d_model: config.hidden_size
  n_heads: 12
  n_kv_heads: 12
  d_gate: 1
  d_head: 128
  d_ffn: 6144
  n_vocab: 32768
  n_layers: 9
  s_max: 2048
model_inputs:
  input_ids:
    kind: tokens
blocks:
  nextt_attention:
    role: attention
    cache:
      family: GQA
      entries:
      - node: k_scale
        kind: kv
      - node: v_heads
        kind: kv
    graph:
      c_q:
        op: shared_linear
        in:
        - x
        - weight_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
