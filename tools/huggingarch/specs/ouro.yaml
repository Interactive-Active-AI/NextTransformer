        - x
        - weight_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      scores:
        op: attention_score
        in:
        - q_scale
        - k_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      probabilities:
        op: softmax
        in: scores
        dims:
          n_heads: n_heads
      weighted_values:
        op: attention_apply
        in:
        - probabilities
        - v_heads
        dims:
          n_heads: n_heads
          d_head: d_head
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: shared_linear
        in:
        - merge_heads
        - weight_c_proj
        dims:
          I: d_model
          O: d_model
    outputs:
    - c_proj
    inputs:
    - x
    - weight_c_q
    - weight_c_k
    - weight_c_v
    - weight_c_proj
