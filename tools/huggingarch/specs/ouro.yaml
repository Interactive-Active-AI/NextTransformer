dim_symbols:
  d_gate:
    kind: whole
    group: per_arch_one_offs
    meaning: Singleton per-head gate axis from gate.unsqueeze(-1) in CausalSelfAttention.forward
custom_ops:
  shared_linear:
    signature:
      x:
      - B
      - s_ctx
      - I
      weight:
      - O
      - I
    flops: 2 * B * s_ctx * I * O
    params: '0'
    shape_kind: axis_replace
    out_key: O
    couples_on:
    - I
    axis_use:
      I:
        category: contract
        param: sum
    formula: y = x @ weight.T
    description: Apply an explicit stored parameter matrix, permitting shared recurrent
      weights without counting another copy.
  shared_embedding_lookup:
    signature:
      reference:
      - B
      - s_ctx
      - D
      input_ids:
      - B
      - s_ctx
      table:
      - V
      - D
    flops: '0'
    params: '0'
    shape_kind: preserve
    couples_on:
    - V
    axis_use:
      V:
        category: route
        param: token_ids
        note: Integer row selection from the shared vocabulary table.
    formula: table[input_ids]; reference supplies output shape only
    description: Repeated indexed read from one physical Value Embedding table; table
      is an explicit shared parameter source.
  one_like_scalar:
    signature:
      reference:
      - B
      - s_ctx
      - '1'
    flops: '0'
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: ones_like(reference)
    description: Source-native elementwise control operation without a registered
      equivalent.
  one_minus_scalar:
    signature:
      x:
      - B
      - s_ctx
      - '1'
    flops: B * s_ctx
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: 1-x
    description: Source-native elementwise control operation without a registered
      equivalent.
  quantile_exit_select:
    signature:
      logits0:
      - B
      - s_ctx
      - V
      logits1:
      - B
      - s_ctx
      - V
      logits2:
      - B
      - s_ctx
      - V
      mass0:
      - B
      - s_ctx
      - '1'
      mass1:
      - B
      - s_ctx
      - '1'
      mass2:
      - B
      - s_ctx
      - '1'
    flops: B * s_ctx * (V + 9)
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: selected=clamp_max(sum(cumsum(exit_masses)<0.5), max_loops-1); output=logits[selected]
      per token
    description: Source-native elementwise control operation without a registered
      equivalent.
