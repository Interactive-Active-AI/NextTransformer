model:
- name: resid_lambdas
  op: parameter_vector
  dims:
    dim: n_layers
  weight_axes:
  - replicated: true
- name: x0_lambdas
  op: parameter_vector
  dims:
    dim: n_layers
  weight_axes:
  - replicated: true
- name: smear_lambda
  op: parameter_vector
  dims:
    dim: '1'
  weight_axes:
  - replicated: true
- name: backout_lambda
  op: parameter_vector
  dims:
    dim: '1'
  weight_axes:
  - replicated: true
- name: transformer.wte
  op: embedding
  boundary_role: input_embedding
  dims:
    n_vocab: n_vocab
    d_model: d_model
  weight_axes:
  - replicated: true
  - replicated: true
  inputs:
  - input_ids
- name: embedding_norm
  op: rmsnorm_unscaled
  dims:
    dim: d_model
  inputs:
  - transformer.wte
- name: smear_current
  op: slice
  axis: 1
  dims:
    out: s_ctx-1
    start: '1'
  inputs:
  - embedding_norm
- name: smear_previous
  op: slice
  axis: 1
  dims:
    out: s_ctx-1
    start: '0'
  inputs:
  - embedding_norm
- name: smear_channels
  op: slice
  dims:
    in: d_model
    out: '24'
    start: '0'
  inputs:
  - smear_current
- name: smear_gate
  op: linear
  dims:
    in: '24'
    out: '1'
  weight_axes:
  - replicated: true
  - replicated: true
  inputs:
  - smear_channels
- name: smear_sigmoid
  op: sigmoid
  dims:
    dim: '1'
  inputs:
  - smear_gate
- name: smear_scaled
  op: mul
  dims:
    dim: '1'
  inputs:
  - smear_sigmoid
  - smear_lambda
- name: smear_contribution
  op: mul
  dims:
    dim: d_model
  inputs:
  - smear_previous
  - smear_scaled
- name: smear_sum
  op: add
  dims:
    dim: d_model
  inputs:
  - smear_current
  - smear_contribution
- name: first_token
  op: slice
  axis: 1
  dims:
    out: '1'
    start: '0'
  inputs:
  - embedding_norm
- name: initial_hidden
  op: concat
  axis: 1
  dims:
    out: s_ctx
  inputs:
  - first_token
  - smear_sum
- name: resid_0
  op: slice
  dims:
    out: '1'
    start: '0'
  inputs:
  - resid_lambdas
- name: x0_0
  op: slice
  dims:
    out: '1'
    start: '0'
  inputs:
  - x0_lambdas
- name: scaled_hidden_0
  op: mul
  dims:
    dim: d_model
  inputs:
  - initial_hidden
  - resid_0
- name: scaled_initial_0
  op: mul
  dims:
    dim: d_model
  inputs:
  - initial_hidden
  - x0_0
- name: mixed_0
  op: add
  dims:
    dim: d_model
  inputs:
  - scaled_hidden_0
  - scaled_initial_0
- name: transformer.h.0
  template: physical_decoder_0
  inputs:
  - mixed_0
- name: resid_1
  op: slice
  dims:
    out: '1'
    start: '1'
  inputs:
  - resid_lambdas
- name: x0_1
  op: slice
  dims:
    out: '1'
    start: '1'
  inputs:
  - x0_lambdas
- name: scaled_hidden_1
  op: mul
  dims:
    dim: d_model
  inputs:
  - transformer.h.0
