          d_head: d_head
      c_k:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      ve_channels:
        op: slice
        in: x
        dims:
          in: d_model
          out: '12'
          start: '0'
      ve_gate:
        op: linear
        in: ve_channels
        dims:
          in: '12'
          out: n_heads
        weight_axes:
        - replicated: true
        - replicated: true
      ve_sigmoid:
        op: sigmoid
        in: ve_gate
        dims:
          dim: n_heads
      ve_scale:
        op: scale_const
        formula: y = 3*x
        in: ve_sigmoid
        dims:
          in: n_heads
      ve_heads:
        op: head_split
        in: ve
        dims:
          n_heads: n_heads
          d_head: d_head
      ve_mul:
        op: headwise_gate
        in:
        - ve_heads
        - ve_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      value_embedding_add:
        op: add
        in:
        - v_heads
        - ve_mul
        dims:
          dim: d_head
      q_rope:
        op: rope
        formula: Inverse half-split RoPE from backbone.apply_rotary_emb; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2*x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse half-split RoPE from backbone.apply_rotary_emb; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2*x
        in: k_norm
        dims:
          in: d_head
      k_window:
        op: sliding_window_kv
        in: k_scale
        dims:
          s_window: s_window
      v_window:
        op: sliding_window_kv
        in: value_embedding_add
        dims:
          s_window: s_window
      scores:
        op: swa_attention_score
        in:
        - q_scale
        - k_window
        dims: &id001
          n_heads: n_heads
          d_head: d_head
          s_window: s_window
      probabilities:
        op: swa_softmax
        in: scores
        dims:
          n_heads: n_heads
          s_window: s_window
      weighted_values:
        op: swa_attention_apply
        in:
        - probabilities
        - v_window
        dims: *id001
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: linear
        in: merge_heads
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
    outputs:
    - c_proj
    cache:
      family: SWA
      entries:
      - node: k_window
        kind: kv
      - node: v_window
        kind: kv
  nextt_swa_ve_decoder:
    role: block
    description: Native parameter-free pre-RMSNorm residual block.
    inputs: &id003
    - x
    - ve
    graph:
      norm_attn:
        op: rmsnorm_unscaled
        in: x
        dims:
          dim: d_model
      attn:
        op: nextt_swa_ve
        in:
        - norm_attn
        - ve
      attn_residual:
        op: add
        in:
        - x
        - attn
        dims:
          dim: d_model
      norm_mlp:
        op: rmsnorm_unscaled
        in: attn_residual
        dims:
          dim: d_model
      mlp:
        op: nemotron_h_relu2_mlp
        inner_modules:
          up_proj: c_fc
          down_proj: c_proj
        in: norm_mlp
      out:
        op: add
        in:
