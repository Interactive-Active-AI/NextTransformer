# Fixed architecture for custom:nextt-gdn_hybrid_swa-8c8cdc99523ad1a1; content_sha256 8c8cdc99523ad1a152621d56602db0ce2a7feaef95391b8c177d478b1926d49b
# Source: exported forward.py LinearMixer.forward, recurrent_attention, ReferenceLM._embed_reference/_block/_readout; backbone.Block.forward.
# Cache declarations estimate architectural streaming states; source rejects kv_cache and only supports full-sequence execution.
# Custom scan FLOPs use direct recurrent arithmetic; registered chunk64 implementation and GPU fusion differ in operation schedule.
# Model-level scales: backout_negative=-1, logit_div15=1/15, logit_mul15=15.
# scale_const values, norm epsilons and RoPE pairing/theta are source-derived display formulas: upstream has no numeric attributes for them.
match:
  model_id:
  - custom:nextt-gdn_hybrid_swa-8c8cdc99523ad1a1
  model_type:
  - nexttransformer_gdn_hybrid_swa
dims:
  d_model: config.hidden_size
  n_heads: config.num_attention_heads
  n_kv_heads: config.num_attention_heads
  d_head: d_model // n_heads
  d_ffn: config.intermediate_size
  n_vocab: config.vocab_size
  n_layers: config.num_hidden_layers
  s_max: config.max_position_embeddings
  s_conv_kernel: config.conv_size
  d_gate_lowrank: config.gate_rank
  s_window: config.sliding_window
model_inputs:
  input_ids:
    kind: tokens
blocks:
  nextt_gdn:
    role: attention
    description: NextTransformer gdn exact forward decomposition.
    inputs:
    - x
    graph:
      c_q:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      q_conv:
        op: conv1d
        weight_axes:
        - replicated: true
        - replicated: true
        - replicated: true
        in: c_q
        dims:
          C: d_model
          C_in: d_model
          C_out: d_model
          kernel_size: s_conv_kernel
          groups: d_model
          dilation: '1'
          bias: '0'
      q_silu:
        op: silu
        in: q_conv
        dims:
          dim: d_model
      q_heads:
        op: head_split
        in: q_silu
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      k_conv:
        op: conv1d
        weight_axes:
        - replicated: true
        - replicated: true
        - replicated: true
        in: c_k
        dims:
          C: d_model
          C_in: d_model
          C_out: d_model
          kernel_size: s_conv_kernel
          groups: d_model
          dilation: '1'
          bias: '0'
      k_silu:
        op: silu
        in: k_conv
        dims:
          dim: d_model
      k_heads:
        op: head_split
        in: k_silu
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      v_conv:
        op: conv1d
        weight_axes:
        - replicated: true
        - replicated: true
        - replicated: true
        in: c_v
        dims:
          C: d_model
          C_in: d_model
          C_out: d_model
          kernel_size: s_conv_kernel
          groups: d_model
          dilation: '1'
          bias: '0'
      v_silu:
        op: silu
        in: v_conv
        dims:
          dim: d_model
      v_heads:
        op: head_split
        in: v_silu
        dims:
          n_heads: n_heads
          d_head: d_head
      q_l2:
        op: l2norm
        in: q_heads
        dims:
          dim: d_head
      k_l2:
        op: l2norm
        in: k_heads
        dims:
          dim: d_head
      beta_proj:
        op: linear
        in: x
        dims:
          in: d_model
          out: n_heads
        weight_axes:
        - replicated: true
        - replicated: true
      beta:
        op: sigmoid
        in: beta_proj
        dims:
          dim: n_heads
      decay_proj:
        op: linear
        in: x
        dims:
          in: d_model
          out: n_heads
        weight_axes:
        - replicated: true
        - replicated: true
      log_decay:
        op: parameter_vector
        dims:
          dim: n_heads
        weight_axes:
        - replicated: true
      dt_bias:
        op: parameter_vector
        dims:
          dim: n_heads
        weight_axes:
        - replicated: true
      gate_bias:
        op: add
        in:
        - decay_proj
        - dt_bias
        dims:
          dim: n_heads
      gate_softplus:
        op: softplus
        in: gate_bias
        dims:
          dim: n_heads
      decay_exp:
        op: exp
        in: log_decay
        dims:
          dim: n_heads
      gate_product:
        op: mul
        in:
        - gate_softplus
        - decay_exp
        dims:
          dim: n_heads
      gate_negative:
        op: scale_const
        formula: y=-x
        in: gate_product
        dims:
          in: n_heads
      scan:
        op: gated_delta_rule
        in:
        - q_l2
        - k_l2
        - v_heads
        - gate_negative
        - beta
        dims:
          n_lin_k_heads: n_heads
          n_lin_v_heads: n_heads
          d_lin_k_head: d_head
          d_lin_v_head: d_head
      output_norm:
        op: rmsnorm_unscaled
        in: scan
        dims:
          dim: d_head
      output_gain:
        op: parameter_vector
        dims:
          dim: d_head
        weight_axes:
        - replicated: true
      output_gain_mul:
        op: mul
        in:
        - output_norm
        - output_gain
        dims:
          dim: d_head
      output_gate:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      output_gate_silu:
        op: silu
        in: output_gate
        dims:
          dim: d_model
      output_gate_heads:
        op: head_split
        in: output_gate_silu
        dims:
          n_heads: n_heads
          d_head: d_head
      output_gated:
        op: mul
        in:
        - output_gain_mul
        - output_gate_heads
        dims:
          dim: d_head
      merge_heads:
        op: head_merge
        in: output_gated
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: linear
        in: merge_heads
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
    outputs:
    - c_proj
    cache:
      family: GatedDeltaNet
      entries:
      - state: q_conv_state
        kind: conv_state
        carrier: q_conv
        shape:
        - d_model
        - s_conv_kernel
      - state: k_conv_state
        kind: conv_state
        carrier: k_conv
        shape:
        - d_model
        - s_conv_kernel
      - state: v_conv_state
        kind: conv_state
