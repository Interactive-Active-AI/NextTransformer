        - d_head
        - d_head
        dtype: F32
  nextt_gdn_decoder:
    role: block
    description: Native parameter-free pre-RMSNorm residual block.
    inputs: &id002
    - x
    graph:
      norm_attn:
        op: rmsnorm_unscaled
        in: x
        dims:
          dim: d_model
      attn:
        op: nextt_gdn
        in: norm_attn
      attn_residual:
        op: add
        in:
        - x
        - attn
        dims:
          dim: d_model
      norm_mlp:
        op: rmsnorm_unscaled
        in: attn_residual
        dims:
          dim: d_model
      mlp:
        op: nemotron_h_relu2_mlp
        inner_modules:
          up_proj: c_fc
          down_proj: c_proj
        in: norm_mlp
      out:
        op: add
        in:
        - attn_residual
        - mlp
        dims:
          dim: d_model
    outputs:
    - out
  nextt_swa_ve:
    role: attention
    description: NextTransformer swa exact forward decomposition.
    inputs:
