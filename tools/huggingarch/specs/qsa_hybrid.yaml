match:
  model_type:
  - nexttransformer_qsa_hybrid
  model_id:
  - custom:nextt-qsa_hybrid-fdb761ba17acf585
dims:
  d_model: config.hidden_size
  n_heads: config.num_attention_heads
  n_kv_heads: config.num_attention_heads
  d_head: d_model // n_heads
  d_ffn: config.intermediate_size
  n_vocab: config.vocab_size
  n_layers: config.num_hidden_layers
  s_max: config.max_position_embeddings
  n_indexer_heads: config.index_heads
  d_indexer_head: config.index_dim
  d_rope: config.index_rope_dim
  s_sparse_block: config.compression_size
  n_selected: config.sparse_topk
  s_conv_kernel: config.conv_size
  d_gate_lowrank: config.gate_rank
model_inputs:
  input_ids:
    kind: tokens
blocks:
  nextt_attention:
    role: attention
    cache:
      family: GQA
      entries: []
    graph:
      c_q:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: &id001
        - &id040
          replicated: true
        - replicated: true
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: *id001
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: *id001
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      index_q:
        op: linear
        in: x
        dims:
          in: d_model
          out: n_indexer_heads*d_indexer_head
        weight_axes: *id001
      iq:
        op: head_split
        in: index_q
        dims:
          n_heads: n_indexer_heads
          d_head: d_indexer_head
      index_k:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_indexer_head
        weight_axes: *id001
      ik:
        op: broadcast
        axis: 1
        in: index_k
        dims:
          width: '1'
      pooled_index:
        op: nt_index_pool
        in: ik
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
      index_k_norm:
        op: rmsnorm_unscaled
        in: pooled_index.result
        dims:
          dim: d_indexer_head
      index_q_norm:
        op: rmsnorm_unscaled
        in: iq
        dims:
          dim: d_indexer_head
      iq_rope:
        op: nt_partial_rope
        formula: Query position j; theta=100000; rotate first index_rope_dim channels
        in: index_q_norm
        dims:
          H: n_indexer_heads
          D: d_indexer_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
      ik_rope:
        op: nt_partial_rope
        formula: Key position j*compression_size; theta=100000; rotate first index_rope_dim
          channels
        in: index_k_norm
        dims:
          H: '1'
          D: d_indexer_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
      selection_scores:
        op: nt_index_scores
        in:
        - iq_rope
        - ik_rope
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
      selection:
        op: nt_select
        in: selection_scores.result
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
      gathered_keys:
        op: nt_gather_selected
        in:
        - k_scale
        - selection.result
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
          Slots: Min(n_selected,Min(Max(1,ceiling(n_selected/s_sparse_block)),ceiling(s_ctx/s_sparse_block))*s_sparse_block)+s_sparse_block
      gathered_values:
        op: nt_gather_selected
        in:
        - v_heads
        - selection.result
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
          Slots: Min(n_selected,Min(Max(1,ceiling(n_selected/s_sparse_block)),ceiling(s_ctx/s_sparse_block))*s_sparse_block)+s_sparse_block
      selected_scores:
        op: nt_selected_score
        in:
        - q_scale
        - gathered_keys.result
        - selection.valid
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
          Slots: Min(n_selected,Min(Max(1,ceiling(n_selected/s_sparse_block)),ceiling(s_ctx/s_sparse_block))*s_sparse_block)+s_sparse_block
      probabilities:
        op: nt_selected_softmax
        in:
        - selected_scores
        - selection.valid
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
          Slots: Min(n_selected,Min(Max(1,ceiling(n_selected/s_sparse_block)),ceiling(s_ctx/s_sparse_block))*s_sparse_block)+s_sparse_block
      weighted_values:
        op: nt_selected_apply
        in:
        - probabilities
        - gathered_values.result
        dims:
          H: n_heads
          D: d_head
          IH: n_indexer_heads
          ID: d_indexer_head
          R: d_rope
          W: s_sparse_block
          K: n_selected
          Slots: Min(n_selected,Min(Max(1,ceiling(n_selected/s_sparse_block)),ceiling(s_ctx/s_sparse_block))*s_sparse_block)+s_sparse_block
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: linear
        in: merge_heads
        dims:
          in: d_model
          out: d_model
        weight_axes: *id001
    outputs:
    - c_proj
    attn_variant: QSA
