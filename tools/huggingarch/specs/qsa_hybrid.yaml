dim_symbols:
  n_selected:
    kind: whole
    group: per_arch_one_offs
    meaning: Fixed token-selection budget in sparse.py.
custom_ops:
  nt_pool:
    signature:
      x:
      - B
      - H
      - s_ctx
      - D
    shape_kind: preserve
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Explicit source gather/reduction dependency
    secondary_outputs:
      result:
      - B
      - H
      - ceiling(s_ctx / W)
      - D
    flops: B*H*ceiling(s_ctx/W)*W*D
    params: '0'
    formula: zero-pad the final block; arithmetic mean over block positions
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
  nt_index_pool:
    signature:
      x:
      - B
      - 1
      - s_ctx
      - ID
    shape_kind: preserve
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Explicit source gather/reduction dependency
    secondary_outputs:
      result:
      - B
      - 1
      - ceiling(s_ctx / W)
      - ID
    flops: B*ceiling(s_ctx/W)*W*ID
    params: '0'
    formula: zero-pad final block; mean over positions
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
  nt_index_scores:
    signature:
      q:
      - B
      - IH
      - s_ctx
      - ID
      k:
      - B
      - 1
      - ceiling(s_ctx / W)
      - ID
    shape_kind: preserve
    couples_on:
    - ID
    - IH
    axis_use:
      ID:
        category: route
        note: Explicit source gather/reduction dependency
      IH:
        category: route
        note: Explicit source gather/reduction dependency
    secondary_outputs:
      result:
      - B
      - s_ctx
      - ceiling(s_ctx / W)
    flops: 2*B*s_ctx*ceiling(s_ctx/W)*IH*ID + B*s_ctx*ceiling(s_ctx/W)*IH
    params: '0'
    formula: sum_h relu(iq dot ik), scale 1/sqrt(index_dim) except QSA
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
  nt_dsa_scores:
    signature:
      q:
      - B
      - IH
      - s_ctx
      - ID
      k:
      - B
      - 1
      - s_ctx
      - ID
      w:
      - B
      - s_ctx
      - IH
    shape_kind: preserve
    couples_on:
    - ID
    - IH
    axis_use:
      ID:
        category: route
        note: Explicit source gather/reduction dependency
      IH:
        category: route
        note: Explicit source gather/reduction dependency
    secondary_outputs:
      result:
      - B
      - s_ctx
      - s_ctx
    flops: 2*B*s_ctx*s_ctx*IH*ID+3*B*s_ctx*s_ctx*IH
    params: '0'
    formula: sum_h relu(iq dot ik)*iw/sqrt(index_heads*index_dim)
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
  nt_select:
    signature:
      scores:
      - B
      - s_ctx
      - ceiling(s_ctx/W)
    shape_kind: preserve
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Explicit source gather/reduction dependency
    secondary_outputs:
      result:
      - B
      - H
      - s_ctx
      - Min(K,Min(Max(1,ceiling(K/W)),ceiling(s_ctx/W))*W)+W
      valid:
      - B
      - H
      - s_ctx
      - Min(K,Min(Max(1,ceiling(K/W)),ceiling(s_ctx/W))*W)+W
    flops: B*s_ctx*ceiling(s_ctx/W)
    params: '0'
    formula: TopK complete blocks, truncate to token_budget, append only final INCOMPLETE
      tail; no forced completed current block
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
  nt_selected_score:
    signature:
      q:
      - B
      - H
      - s_ctx
      - D
      gathered_k:
      - B
      - H
      - s_ctx
      - Slots
      - D
      valid:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: axis_replace
    couples_on:
    - D
    axis_use:
      D:
        category: contract
        param: sum
    flops: 2*B*H*s_ctx*(Min(K,Min(Max(1,ceiling(K/W)),ceiling(s_ctx/W))*W)+W)*D
    params: '0'
    formula: gather selected keys; dot q / sqrt(head_dim); apply causal validity;
      invalid slots remain materialized
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
    out_key: Slots
  nt_selected_softmax:
    signature:
      scores:
      - B
      - H
      - s_ctx
      - Slots
      valid:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: preserve
    couples_on:
    - Slots
    axis_use:
      Slots:
        category: normalize
        param: softmax
    flops: 5*B*H*s_ctx*(Min(K,Min(Max(1,ceiling(K/W)),ceiling(s_ctx/W))*W)+W)
    params: '0'
    formula: 'safe_softmax(scores,valid): zero all-invalid rows; softmax then multiply
      valid'
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
  nt_selected_apply:
    signature:
      p:
      - B
      - H
      - s_ctx
      - Slots
      gathered_v:
      - B
      - H
      - s_ctx
      - Slots
      - D
    shape_kind: axis_replace
    couples_on:
    - Slots
    axis_use:
      Slots:
        category: contract
        param: sum
    flops: 2*B*H*s_ctx*(Min(K,Min(Max(1,ceiling(K/W)),ceiling(s_ctx/W))*W)+W)*D
    params: '0'
    formula: gather selected values; sum p*v, preserving invalid padded slots in reference
      execution
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
    out_key: D
  nt_partial_rope:
    signature:
      x:
      - B
      - H
      - s_ctx
      - D
    shape_kind: preserve
    couples_on:
    - D
    axis_use:
      D:
        category: route
        note: Explicit source gather/reduction dependency
    flops: 3*B*H*s_ctx*R
    params: '0'
    formula: rotate first index_rope_dim channels at theta=100000; actual query/key
      position rule declared on each call
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
  nt_gather_selected:
    signature:
      x:
      - B
      - H
      - s_ctx
      - D
      indices:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: preserve
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Explicit source gather/reduction dependency
    secondary_outputs:
      result:
      - B
      - H
      - s_ctx
      - Slots
      - D
    flops: '0'
    params: '0'
    formula: gather_keys materializes selected rows [B,H,Q,Kslots,D]
    description: Atomic source operation with explicit output geometry; no bundled
      learned projections.
