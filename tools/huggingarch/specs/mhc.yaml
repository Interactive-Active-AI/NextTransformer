    graph:
      initial_streams:
        op: broadcast
        axis: 2
        dims:
          width: n_hidden_copies
        in: x
      mhc_flat_0:
        op: view_merge
        in: initial_streams
      mhc_norm_0:
        op: rmsnorm_unscaled
        dims:
          dim: n_hidden_copies*d_model
        in: mhc_flat_0
      mhc_logits_0:
        op: nt_mhc_projection
        dims:
          ND: n_hidden_copies*d_model
          A: d_hc_mix
        in:
        - mhc_norm_0
        - p0
      mhc_maps_0:
        op: nt_mhc_maps
        dims:
          N: n_hidden_copies
          A: d_hc_mix
          I: '20'
        in:
        - mhc_logits_0.value
        - p2
        - p1
      mhc_read_0:
        op: nt_hc_read
        dims:
          N: n_hidden_copies
          D: d_model
        in:
        - initial_streams
        - mhc_maps_0.pre
      mhc_mix_0:
        op: hc_mix
        dims:
          n_hidden_copies: n_hidden_copies
          d_model: d_model
        in:
        - mhc_maps_0.res
        - initial_streams
      branch_norm_0:
        op: rmsnorm_unscaled
        dims:
          dim: d_model
        in: mhc_read_0.value
      value_embeds.0:
        op: embedding
        dims:
          d_model: d_model
          n_vocab: n_vocab
        weight_axes:
        - replicated: true
        - replicated: true
        in: input_ids
        module: value_embeds.0
      transformer.h.0.attn:
        in:
        - branch_norm_0
        - value_embeds.0
        op: nextt_attention_ve
        module: transformer.h.0.attn
      hc_write_0:
        op: nt_hc_write
        dims:
          N: n_hidden_copies
          D: d_model
        in:
        - mhc_mix_0
        - transformer.h.0.attn
        - mhc_maps_0.post
      mhc_flat_1:
        op: view_merge
        in: hc_write_0.value
      mhc_norm_1:
        op: rmsnorm_unscaled
        dims:
          dim: n_hidden_copies*d_model
        in: mhc_flat_1
      mhc_logits_1:
        op: nt_mhc_projection
        dims:
          ND: n_hidden_copies*d_model
          A: d_hc_mix
        in:
        - mhc_norm_1
        - p3
      mhc_maps_1:
        op: nt_mhc_maps
        dims:
          N: n_hidden_copies
          A: d_hc_mix
          I: '20'
        in:
        - mhc_logits_1.value
        - p5
        - p4
      mhc_read_1:
        op: nt_hc_read
        dims:
          N: n_hidden_copies
          D: d_model
        in:
        - hc_write_0.value
        - mhc_maps_1.pre
      mhc_mix_1:
