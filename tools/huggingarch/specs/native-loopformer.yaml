  condition_0:
    inputs:
    - reference
    - cp0
    - cp1
    - cp2
    - cp3
    - cp4
    - cp5
    - cp6
    - cp7
    graph:
      time_fourier:
        op: nt_fourier_time_0
        in: reference
        dims:
          D: d_model
      time_fc0:
        op: nt_rank2_linear
        in:
        - time_fourier.features
        - cp0
        dims:
          I: '256'
          O: d_model
      time_bias0:
        op: nt_rank2_bias
        in:
        - time_fc0
        - cp1
        dims:
          D: d_model
      time_silu:
        op: nt_rank2_silu
        in: time_bias0
        dims:
          D: d_model
      time_fc2:
        op: nt_rank2_linear
        in:
        - time_silu
        - cp2
        dims:
          I: d_model
          O: d_model
      time_bias2:
        op: nt_rank2_bias
        in:
        - time_fc2
        - cp3
        dims:
          D: d_model
      delta_fourier:
        op: nt_fourier_delta_0
        in: reference
        dims:
          D: d_model
      delta_fc0:
        op: nt_rank2_linear
        in:
        - delta_fourier.features
        - cp4
        dims:
          I: '256'
          O: d_model
      delta_bias0:
        op: nt_rank2_bias
        in:
        - delta_fc0
        - cp5
        dims:
          D: d_model
      delta_silu:
        op: nt_rank2_silu
        in: delta_bias0
        dims:
          D: d_model
      delta_fc2:
        op: nt_rank2_linear
        in:
        - delta_silu
        - cp6
        dims:
          I: d_model
          O: d_model
      delta_bias2:
        op: nt_rank2_bias
        in:
        - delta_fc2
        - cp7
        dims:
          D: d_model
      sum:
        op: nt_rank2_add
        in:
        - time_bias2
        - delta_bias2
        dims:
          D: d_model
      norm:
        op: nt_rank2_norm
        in: sum
        dims:
          D: d_model
    outputs:
    - norm
  condition_1:
    inputs:
    - reference
    - cp0
    - cp1
    - cp2
    - cp3
    - cp4
    - cp5
    - cp6
    - cp7
    graph:
      time_fourier:
        op: nt_fourier_time_1
        in: reference
        dims:
          D: d_model
      time_fc0:
        op: nt_rank2_linear
        in:
