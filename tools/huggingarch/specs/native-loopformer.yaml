match:
  model_type:
  - nexttransformer_native_loopformer
  model_id:
  - custom:nextt-native-loopformer
dims:
  d_model: config.hidden_size
  n_heads: config.num_attention_heads
  n_kv_heads: config.num_attention_heads
  d_head: d_model // n_heads
  d_ffn: config.intermediate_size
  n_vocab: config.vocab_size
  n_layers: config.num_hidden_layers
  s_max: config.max_position_embeddings
model_inputs:
  input_ids:
    kind: tokens
blocks:
  nextt_attention:
    role: attention
    cache:
      family: GQA
      entries:
      - node: k_scale
        kind: kv
      - node: v_heads
        kind: kv
    graph:
      c_q:
        op: nt_shared_linear
        in:
        - x
        - w_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: nt_shared_linear
        in:
        - x
        - w_c_k
        dims:
          I: d_model
          O: d_model
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: nt_shared_linear
        in:
        - x
        - w_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      scores:
        op: attention_score
        in:
        - q_scale
        - k_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      probabilities:
        op: softmax
        in: scores
        dims:
          n_heads: n_heads
      weighted_values:
        op: attention_apply
        in:
        - probabilities
        - v_heads
        dims:
          n_heads: n_heads
          d_head: d_head
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: nt_shared_linear
        in:
        - merge_heads
        - w_c_proj
        dims:
          I: d_model
          O: d_model
    outputs:
    - c_proj
    inputs:
    - x
    - w_c_q
    - w_c_k
    - w_c_v
    - w_c_proj
  nextt_ffn:
    role: ffn_dense
    graph:
      c_fc:
        op: nt_shared_linear
        in:
        - x
        - w_c_fc
        dims:
          I: d_model
          O: d_ffn
      relu:
        op: relu
        in: c_fc
        dims:
          dim: d_ffn
      square:
        op: mul
        in:
        - relu
        - relu
        dims:
          dim: d_ffn
      c_proj:
        op: nt_shared_linear
        in:
        - square
        - w_c_proj
        dims:
          I: d_ffn
          O: d_model
    outputs:
    - c_proj
    inputs:
    - x
    - w_c_fc
    - w_c_proj
  nextt_attention_ve:
    role: attention
    inputs:
    - x
    - ve
    - w_c_q
    - w_c_k
    - w_c_v
    - w_ve_gate
    - w_c_proj
    cache:
      family: GQA
      entries:
      - node: k_scale
        kind: kv
      - node: v_mixed
        kind: kv
    graph:
      c_q:
        op: nt_shared_linear
        in:
        - x
        - w_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: nt_shared_linear
        in:
        - x
        - w_c_k
        dims:
          I: d_model
          O: d_model
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: nt_shared_linear
        in:
        - x
        - w_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      gate_channels:
        op: slice
        in: x
        dims:
          in: d_model
          out: '12'
          start: '0'
      ve_gate:
        op: nt_shared_linear
        in:
        - gate_channels
        - w_ve_gate
        dims:
          I: '12'
          O: n_heads
      gate_sigmoid:
        op: sigmoid
        in: ve_gate
        dims:
          dim: n_heads
      gate3:
        op: scale_const
        formula: 3 * x
        in: gate_sigmoid
        dims:
          in: n_heads
      ve_heads:
        op: head_split
        in: ve
        dims:
          n_heads: n_heads
          d_head: d_head
      gated_ve:
        op: headwise_gate
        in:
        - ve_heads
        - gate3
        dims:
          n_heads: n_heads
          d_head: d_head
      v_mixed:
        op: add
        in:
        - v_heads
        - gated_ve
        dims:
          dim: d_head
      scores:
        op: attention_score
        in:
        - q_scale
        - k_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      probabilities:
        op: softmax
        in: scores
        dims:
          n_heads: n_heads
      weighted_values:
        op: attention_apply
        in:
        - probabilities
        - v_mixed
        dims:
          n_heads: n_heads
          d_head: d_head
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: nt_shared_linear
        in:
        - merge_heads
        - w_c_proj
        dims:
          I: d_model
          O: d_model
    outputs:
    - c_proj
  shared_value_lookup:
    inputs:
    - ids
    - table
    graph:
      lookup:
        op: nt_shared_embedding
        in:
        - ids
        - table
        dims:
          V: n_vocab
          D: d_model
      out:
        op: identity
        in: lookup.value
    outputs:
    - out
  nextt_attention_short:
    role: attention
    cache:
      family: SWA
      entries:
      - node: window_k
        kind: kv
      - node: window_v
        kind: kv
    graph:
      c_q:
        op: nt_shared_linear
        in:
        - x
        - w_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: nt_shared_linear
        in:
        - x
        - w_c_k
        dims:
          I: d_model
          O: d_model
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: nt_shared_linear
        in:
        - x
        - w_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      window_k:
        op: sliding_window_kv
        in: k_scale
        dims:
          s_window: '513'
      window_v:
        op: sliding_window_kv
        in: v_heads
        dims:
          s_window: '513'
      scores:
        op: swa_attention_score
        in:
        - q_scale
        - window_k
        dims:
          n_heads: n_heads
          d_head: d_head
          s_window: '513'
      probabilities:
        op: swa_softmax
        in: scores
        dims:
          n_heads: n_heads
          s_window: '513'
      weighted_values:
        op: swa_attention_apply
        in:
        - probabilities
        - window_v
        dims:
          n_heads: n_heads
          d_head: d_head
          s_window: '513'
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: nt_shared_linear
        in:
        - merge_heads
        - w_c_proj
        dims:
          I: d_model
          O: d_model
    outputs:
    - c_proj
    inputs:
    - x
    - w_c_q
    - w_c_k
    - w_c_v
    - w_c_proj
