        in:
        - time_fc0
        - cp1
        dims:
          D: d_model
      time_silu:
        op: nt_rank2_silu
        in: time_bias0
        dims:
          D: d_model
      time_fc2:
        op: nt_rank2_linear
        in:
        - time_silu
        - cp2
        dims:
          I: d_model
          O: d_model
      time_bias2:
        op: nt_rank2_bias
        in:
        - time_fc2
        - cp3
        dims:
          D: d_model
      delta_fourier:
        op: nt_fourier_delta_1
        in: reference
        dims:
          D: d_model
      delta_fc0:
        op: nt_rank2_linear
        in:
        - delta_fourier.features
        - cp4
        dims:
          I: '256'
          O: d_model
      delta_bias0:
        op: nt_rank2_bias
        in:
        - delta_fc0
        - cp5
        dims:
          D: d_model
      delta_silu:
        op: nt_rank2_silu
        in: delta_bias0
        dims:
          D: d_model
      delta_fc2:
        op: nt_rank2_linear
        in:
        - delta_silu
        - cp6
        dims:
          I: d_model
          O: d_model
      delta_bias2:
        op: nt_rank2_bias
        in:
        - delta_fc2
        - cp7
        dims:
          D: d_model
      sum:
        op: nt_rank2_add
        in:
        - time_bias2
        - delta_bias2
        dims:
          D: d_model
      norm:
        op: nt_rank2_norm
        in: sum
        dims:
          D: d_model
    outputs:
    - norm
  loop_modulation:
    inputs:
    - condition
    - weight
    graph:
      silu:
        op: nt_rank2_silu
        in: condition
        dims:
          D: d_model
      projection:
        op: nt_rank2_linear
        in:
        - silu
        - weight
        dims:
          I: d_model
          O: 4*d_model
      bounded:
        op: nt_rank2_bounded_tanh
        in: projection
        dims:
          D: 4*d_model
    outputs:
    - bounded
  conditioned_nextt_attention:
    inputs:
    - x
    - modulation
    - attn_w_c_q
    - attn_w_c_k
    - attn_w_c_v
    - attn_w_c_proj
    - mlp_w_c_fc
    - mlp_w_c_proj
    graph:
      ga:
        op: slice
        in: modulation
        dims:
          out: d_model
          start: 0*d_model
      gm:
        op: slice
        in: modulation
        dims:
          out: d_model
          start: 1*d_model
      sa:
        op: slice
        in: modulation
        dims:
          out: d_model
          start: 2*d_model
      sm:
        op: slice
        in: modulation
        dims:
          out: d_model
          start: 3*d_model
      norm_attn:
        op: rmsnorm_unscaled
        in: x
        dims:
          dim: d_model
      scaled_attn_input:
        op: nt_offset_modulate
        in:
        - norm_attn
        - sa
        dims:
          D: d_model
      attn:
        op: nextt_attention
        in:
        - scaled_attn_input
        - attn_w_c_q
        - attn_w_c_k
        - attn_w_c_v
        - attn_w_c_proj
      gated_attn:
        op: nt_offset_modulate
        in:
        - attn
        - ga
        dims:
          D: d_model
      attn_add:
        op: add
        in:
        - x
        - gated_attn
        dims:
          dim: d_model
      norm_mlp:
        op: rmsnorm_unscaled
        in: attn_add
        dims:
          dim: d_model
      scaled_mlp_input:
        op: nt_offset_modulate
        in:
        - norm_mlp
        - sm
        dims:
          D: d_model
      mlp:
        op: nextt_ffn
        in:
        - scaled_mlp_input
        - mlp_w_c_fc
        - mlp_w_c_proj
      gated_mlp:
        op: nt_offset_modulate
        in:
        - mlp
        - gm
        dims:
          D: d_model
      out:
        op: add
        in:
        - attn_add
        - gated_mlp
        dims:
          dim: d_model
    outputs:
    - out
  conditioned_nextt_attention_ve:
    inputs:
    - x
    - ve
    - modulation
    - attn_w_c_q
    - attn_w_c_k
    - attn_w_c_v
    - attn_w_ve_gate
    - attn_w_c_proj
    - mlp_w_c_fc
    - mlp_w_c_proj
    graph:
