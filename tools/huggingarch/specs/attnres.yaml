match:
  model_type:
  - nexttransformer_attnres
  model_id:
  - custom:nextt-attnres
dims:
  d_model: config.hidden_size
  n_heads: config.num_attention_heads
  n_kv_heads: config.num_attention_heads
  d_head: d_model // n_heads
  d_ffn: config.intermediate_size
  n_vocab: config.vocab_size
  n_layers: config.num_hidden_layers
  s_max: config.max_position_embeddings
model_inputs:
  input_ids:
    kind: tokens
blocks:
  nextt_attention:
    role: attention
    cache:
      family: GQA
      entries:
      - node: k_scale
        kind: kv
      - node: v_heads
        kind: kv
    graph:
      c_q:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: &id001
        - &id038
          replicated: true
        - replicated: true
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: *id001
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: *id001
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      scores:
        op: attention_score
        in:
        - q_scale
        - k_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      probabilities:
        op: softmax
        in: scores
        dims:
          n_heads: n_heads
      weighted_values:
        op: attention_apply
        in:
        - probabilities
        - v_heads
        dims:
          n_heads: n_heads
          d_head: d_head
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: linear
        in: merge_heads
        dims:
          in: d_model
          out: d_model
        weight_axes: *id001
    outputs:
    - c_proj
  nextt_ffn:
    role: ffn_dense
    graph:
      c_fc:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_ffn
        weight_axes: *id001
      relu:
        op: relu
        in: c_fc
        dims:
          dim: d_ffn
      square:
        op: mul
        in:
        - relu
        - relu
        dims:
          dim: d_ffn
      c_proj:
        op: linear
        in: square
        dims:
          in: d_ffn
          out: d_model
        weight_axes: *id001
    outputs:
    - c_proj
  nextt_attention_ve:
    role: attention
    inputs: &id003
    - x
    - ve
    cache:
      family: GQA
      entries:
      - node: k_scale
        kind: kv
      - node: v_mixed
        kind: kv
    graph:
      c_q:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: &id002
        - replicated: true
        - replicated: true
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: *id002
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes: *id002
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      gate_channels:
        op: slice
        in: x
        dims:
          in: d_model
          out: '12'
          start: '0'
      ve_gate:
        op: linear
        in: gate_channels
        dims:
          in: '12'
          out: n_heads
        weight_axes: *id001
      gate_sigmoid:
        op: sigmoid
        in: ve_gate
        dims:
          dim: n_heads
      gate3:
        op: scale_const
        formula: 3 * x
        in: gate_sigmoid
        dims:
          in: n_heads
      ve_heads:
        op: head_split
        in: ve
        dims:
          n_heads: n_heads
          d_head: d_head
      gated_ve:
        op: headwise_gate
        in:
        - ve_heads
        - gate3
        dims:
          n_heads: n_heads
          d_head: d_head
      v_mixed:
        op: add
        in:
        - v_heads
        - gated_ve
        dims:
          dim: d_head
      scores:
        op: attention_score
        in:
        - q_scale
        - k_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      probabilities:
        op: softmax
        in: scores
        dims:
          n_heads: n_heads
      weighted_values:
        op: attention_apply
        in:
        - probabilities
        - v_mixed
        dims:
          n_heads: n_heads
          d_head: d_head
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: linear
        in: merge_heads
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
    outputs:
    - c_proj
  module_transformer_h_0_attn:
    inputs: *id003
    graph:
      call:
        op: nextt_attention_ve
        in: *id003
        module: transformer.h.0.attn
    outputs:
    - call
