  nextt_residual_model:
    inputs:
    - x
    - input_ids
    - p0
    graph:
      depth_key_0:
        op: rmsnorm_unscaled
        dims:
          dim: d_model
        in: x
      depth_query_0:
        op: slice
        axis: 0
        dims:
          out: '1'
          start: '0'
        in: p0
      depth_score_0_0:
        op: nt_depth_score
        dims:
          D: d_model
        in:
        - depth_key_0
        - depth_query_0
      depth_probabilities_0:
        op: softmax_act
        dims:
          dim: '1'
        in: depth_score_0_0.logits
      depth_weight_0_0:
        op: slice
        dims:
          out: '1'
          start: '0'
        in: depth_probabilities_0
      depth_weighted_0_0:
        op: mul
        dims:
          dim: d_model
        in:
        - x
        - depth_weight_0_0
      branch_norm_0:
        op: rmsnorm_unscaled
        dims:
          dim: d_model
        in: depth_weighted_0_0
      value_embeds.0:
        op: embedding
        dims:
          d_model: d_model
          n_vocab: n_vocab
        weight_axes:
        - replicated: true
        - replicated: true
        in: input_ids
        module: value_embeds.0
      transformer.h.0.attn:
        in:
        - branch_norm_0
        - value_embeds.0
        op: nextt_attention_ve
        module: transformer.h.0.attn
      depth_key_1:
        op: rmsnorm_unscaled
        dims:
          dim: d_model
        in: transformer.h.0.attn
      depth_query_1:
        op: slice
        axis: 0
        dims:
          out: '1'
          start: '1'
        in: p0
      depth_score_1_0:
        op: nt_depth_score
        dims:
          D: d_model
        in:
        - depth_key_0
        - depth_query_1
      depth_score_1_1:
        op: nt_depth_score
        dims:
          D: d_model
        in:
        - depth_key_1
        - depth_query_1
      depth_logits_1:
        op: concat
        axis: 2
        in:
        - depth_score_1_0.logits
        - depth_score_1_1.logits
      depth_probabilities_1:
        op: softmax_act
        dims:
          dim: '2'
        in: depth_logits_1
      depth_weight_1_0:
        op: slice
        dims:
          out: '1'
          start: '0'
        in: depth_probabilities_1
      depth_weighted_1_0:
        op: mul
        dims:
          dim: d_model
        in:
        - x
        - depth_weight_1_0
      depth_weight_1_1:
        op: slice
        dims:
          out: '1'
          start: '1'
        in: depth_probabilities_1
      depth_weighted_1_1:
        op: mul
        dims:
          dim: d_model
        in:
        - transformer.h.0.attn
        - depth_weight_1_1
      depth_accumulate_1_1:
        op: add
        dims:
          dim: d_model
        in:
        - depth_weighted_1_0
        - depth_weighted_1_1
      branch_norm_1:
        op: rmsnorm_unscaled
        dims:
          dim: d_model
        in: depth_accumulate_1_1
      transformer.h.0.mlp:
        in: branch_norm_1
        op: nextt_ffn
        module: transformer.h.0.mlp
      partial_sum_1:
        op: add
        dims:
          dim: d_model
        in:
        - transformer.h.0.attn
        - transformer.h.0.mlp
      depth_key_2:
        op: rmsnorm_unscaled
        dims:
          dim: d_model
        in: partial_sum_1
      depth_query_2:
        op: slice
        axis: 0
        dims:
          out: '1'
          start: '2'
        in: p0
      depth_score_2_0:
        op: nt_depth_score
        dims:
          D: d_model
        in:
        - depth_key_0
        - depth_query_2
      depth_score_2_1:
        op: nt_depth_score
        dims:
          D: d_model
        in:
        - depth_key_2
        - depth_query_2
      depth_logits_2:
        op: concat
        axis: 2
        in:
        - depth_score_2_0.logits
        - depth_score_2_1.logits
      depth_probabilities_2:
        op: softmax_act
        dims:
          dim: '2'
        in: depth_logits_2
      depth_weight_2_0:
        op: slice
        dims:
          out: '1'
          start: '0'
        in: depth_probabilities_2
      depth_weighted_2_0:
        op: mul
        dims:
          dim: d_model
        in:
        - x
        - depth_weight_2_0
      depth_weight_2_1:
        op: slice
        dims:
          out: '1'
          start: '1'
        in: depth_probabilities_2
      depth_weighted_2_1:
        op: mul
        dims:
          dim: d_model
        in:
        - partial_sum_1
        - depth_weight_2_1
      depth_accumulate_2_1:
        op: add
        dims:
          dim: d_model
        in:
        - depth_weighted_2_0
        - depth_weighted_2_1
      branch_norm_2:
        op: rmsnorm_unscaled
        dims:
          dim: d_model
        in: depth_accumulate_2_1
      transformer.h.1.attn:
        in: branch_norm_2
        op: nextt_attention
        module: transformer.h.1.attn
      partial_sum_2:
