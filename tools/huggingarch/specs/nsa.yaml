      compress_v:
        op: linear
        in: v_flat
        dims:
          in: nsa_block*d_head
          out: d_head
        weight_axes: *id001
      branch_gate:
        op: linear
        in: x
        dims:
          in: d_model
          out: 3*n_heads
        weight_axes: *id001
      branch_sigmoid:
        op: sigmoid
        in: branch_gate
        dims:
          dim: 3*n_heads
      gates:
