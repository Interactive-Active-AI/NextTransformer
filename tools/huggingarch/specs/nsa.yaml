dim_symbols:
  nsa_block:
    kind: whole
    group: per_arch_one_offs
    meaning: Nonoverlapping compression/selection block size in sparse.py.
  nsa_budget:
    kind: whole
    group: per_arch_one_offs
    meaning: Configured NSA selected-token/local-window extent in sparse.py.
  nsa_local_window:
    kind: whole
    group: per_arch_one_offs
    meaning: Configured NSA selected-token/local-window extent in sparse.py.
custom_ops:
  nsa_pad_blocks:
    signature:
      x:
      - B
      - H
      - s_ctx
      - D
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - ceiling(s_ctx/W)
      - W
      - D
    flops: '0'
    params: '0'
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Source block selection or contraction
    formula: Zero-pad final incomplete compression block, reshape into block-position
      axis
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_compressed_score:
    signature:
      q:
      - B
      - H
      - s_ctx
      - D
      k:
      - B
      - H
      - ceiling(s_ctx/W)
      - D
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - s_ctx
      - ceiling(s_ctx/W)
    flops: 2*B*H*s_ctx*ceiling(s_ctx/W)*D
    params: '0'
    couples_on:
    - D
    axis_use:
      D:
        category: route
        note: Source block selection or contraction
    formula: Q dot compressed K /sqrt(head_dim)
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_comp_softmax:
    signature:
      score:
      - B
      - H
      - s_ctx
      - ceiling(s_ctx/W)
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - s_ctx
      - ceiling(s_ctx/W)
    flops: 5*B*H*s_ctx*ceiling(s_ctx/W)
    params: '0'
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Source block selection or contraction
    formula: safe_softmax; only completed blocks ((j+1)*size-1<=query) visible
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_comp_apply:
    signature:
      p:
      - B
      - H
      - s_ctx
      - ceiling(s_ctx/W)
      v:
      - B
      - H
      - ceiling(s_ctx/W)
      - D
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - s_ctx
      - D
    flops: 2*B*H*s_ctx*ceiling(s_ctx/W)*D
    params: '0'
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Source block selection or contraction
    formula: compressed probability @ compressed V
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_select:
    signature:
      p:
      - B
      - H
      - s_ctx
      - ceiling(s_ctx/W)
    shape_kind: preserve
    secondary_outputs:
      indices:
      - B
      - H
      - s_ctx
      - Min(Max(1,K//W),ceiling(s_ctx/W))*W+W
      valid:
      - B
      - H
      - s_ctx
      - Min(Max(1,K//W),ceiling(s_ctx/W))*W+W
    flops: B*H*s_ctx*ceiling(s_ctx/W)
    params: '0'
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Source block selection or contraction
    formula: TopK(max(1,budget/W)) complete historical compressed blocks, exclude
      current; append forced current block; causal+range validity
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_local_indices:
    signature:
      q:
      - B
      - H
      - s_ctx
      - D
    shape_kind: preserve
    secondary_outputs:
      indices:
      - B
      - H
      - s_ctx
      - L
      valid:
      - B
      - H
      - s_ctx
      - L
    flops: '0'
    params: '0'
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Source block selection or contraction
    formula: indices=(positions-arange(local_window)).flip(-1); clamp negative for
      gather and keep separate validity
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_selected_score:
    signature:
      q:
      - B
      - H
      - s_ctx
      - D
      gathered_k:
      - B
      - H
      - s_ctx
      - Slots
      - D
      valid:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: axis_replace
    flops: 2*B*H*s_ctx*(Min(Max(1,K//W),ceiling(s_ctx/W))*W+W)*D
    params: '0'
    couples_on:
    - D
    axis_use:
      D:
        category: contract
        param: sum
    formula: gather K by indices, q dot selected K /sqrt(head_dim); mask invalid
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
    out_key: Slots
  nsa_selected_softmax:
    signature:
      s:
      - B
      - H
      - s_ctx
      - Slots
      valid:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: preserve
    flops: 5*B*H*s_ctx*(Min(Max(1,K//W),ceiling(s_ctx/W))*W+W)
    params: '0'
    couples_on:
    - Slots
    axis_use:
      Slots:
        category: normalize
        param: softmax
    formula: safe_softmax(...,valid); zero all-invalid rows
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_selected_apply:
    signature:
      p:
      - B
      - H
      - s_ctx
      - Slots
      gathered_v:
      - B
      - H
      - s_ctx
      - Slots
      - D
    shape_kind: axis_replace
    flops: 2*B*H*s_ctx*(Min(Max(1,K//W),ceiling(s_ctx/W))*W+W)*D
    params: '0'
    couples_on:
    - Slots
    axis_use:
      Slots:
        category: contract
        param: sum
    formula: gather V, sum p*V including allocated padded slots
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
    out_key: D
  nsa_local_score:
    signature:
      q:
      - B
      - H
      - s_ctx
      - D
      gathered_k:
      - B
      - H
      - s_ctx
      - Slots
      - D
      valid:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: axis_replace
    flops: 2*B*H*s_ctx*(L)*D
    params: '0'
    couples_on:
    - D
    axis_use:
      D:
        category: contract
        param: sum
    formula: gather K by indices, q dot selected K /sqrt(head_dim); mask invalid
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
    out_key: Slots
  nsa_local_softmax:
    signature:
      s:
      - B
      - H
      - s_ctx
      - Slots
      valid:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: preserve
    flops: 5*B*H*s_ctx*(L)
    params: '0'
    couples_on:
    - Slots
    axis_use:
      Slots:
        category: normalize
        param: softmax
    formula: safe_softmax(...,valid); zero all-invalid rows
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_local_apply:
    signature:
      p:
      - B
      - H
      - s_ctx
      - Slots
      gathered_v:
      - B
      - H
      - s_ctx
      - Slots
      - D
    shape_kind: axis_replace
    flops: 2*B*H*s_ctx*(L)*D
    params: '0'
    couples_on:
    - Slots
    axis_use:
      Slots:
        category: contract
        param: sum
    formula: gather V, sum p*V including allocated padded slots
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
    out_key: D
  nsa_gate_reshape:
    signature:
      g:
      - B
      - s_ctx
      - HG
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - s_ctx
      - 3
    flops: '0'
    params: '0'
    couples_on: []
    axis_use: {}
    formula: reshape B,T,H,3 and transpose to B,H,T,3
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_branch_mix:
    signature:
      c:
      - B
      - H
      - s_ctx
      - D
      s:
      - B
      - H
      - s_ctx
      - D
      l:
      - B
      - H
      - s_ctx
      - D
      g:
      - B
      - H
      - s_ctx
      - 3
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - s_ctx
      - D
    flops: 5*B*H*s_ctx*D
    params: '0'
    couples_on: []
    axis_use: {}
    formula: compressed*g[...,0]+selected*g[...,1]+local*g[...,2]
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_selected_gather:
    signature:
      x:
      - B
      - H
      - s_ctx
      - D
      indices:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - s_ctx
      - Slots
      - D
    flops: '0'
    params: '0'
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Source block selection or contraction
    formula: gather_keys materializes selected [B,H,Q,Kslots,D]
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
  nsa_local_gather:
    signature:
      x:
      - B
      - H
      - s_ctx
      - D
      indices:
      - B
      - H
      - s_ctx
      - Slots
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - H
      - s_ctx
      - Slots
      - D
    flops: '0'
    params: '0'
    couples_on:
    - s_ctx
    axis_use:
      s_ctx:
        category: route
        note: Source block selection or contraction
    formula: gather_keys materializes selected [B,H,Q,Kslots,D]
    description: Atomic source kernel; all learned projections are distinct linear
      nodes.
