        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
