  - nexttransformer_nsa
  model_id:
  - custom:nextt-nsa-7e56a2c85151f8b4
dims:
  d_model: config.hidden_size
  n_heads: config.num_attention_heads
  n_kv_heads: config.num_attention_heads
  d_head: d_model // n_heads
  d_ffn: config.intermediate_size
  n_vocab: config.vocab_size
  n_layers: config.num_hidden_layers
  s_max: config.max_position_embeddings
  nsa_block: config.compression_size
  nsa_budget: config.sparse_topk
  nsa_local_window: config.local_window
model_inputs:
  input_ids:
    kind: tokens
blocks:
  nextt_attention:
    role: attention
    cache:
      family: GQA
      entries: []
    graph:
      c_q:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: linear
        in: x
        dims:
          in: d_model
          out: d_model
        weight_axes:
        - replicated: true
        - replicated: true
      k_heads:
