          s_window: '513'
      weighted_values:
        op: swa_attention_apply
        in:
        - probabilities
        - v_mixed_window
        dims:
          n_heads: n_heads
          d_head: d_head
          s_window: '513'
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: shared_linear
        in:
        - merge_heads
        - weight_c_proj
        dims:
          I: d_model
          O: d_model
      k_scale_window:
        op: sliding_window_kv
        in: k_scale
        dims:
          s_window: '513'
      v_mixed_window:
        op: sliding_window_kv
        in: v_mixed
        dims:
          s_window: '513'
    outputs:
    - c_proj
  nextt_decoder__short:
    role: block
    inputs:
    - x
    - attn_weight_c_q
    - attn_weight_c_k
    - attn_weight_c_v
    - attn_weight_c_proj
    - mlp_weight_c_fc
    - mlp_weight_c_proj
    graph:
      norm_attn:
        op: rmsnorm_unscaled
        in: x
        dims:
          dim: d_model
      attn:
        op: nextt_attention_short
        in:
        - norm_attn
        - attn_weight_c_q
        - attn_weight_c_k
        - attn_weight_c_v
        - attn_weight_c_proj
      attn_residual:
        op: add
        in:
        - x
        - attn
        dims:
          dim: d_model
      norm_mlp:
        op: rmsnorm_unscaled
        in: attn_residual
        dims:
          dim: d_model
      mlp:
        op: nextt_ffn
        in:
        - norm_mlp
        - mlp_weight_c_fc
        - mlp_weight_c_proj
      out:
        op: add
        in:
        - attn_residual
        - mlp
        dims:
          dim: d_model
