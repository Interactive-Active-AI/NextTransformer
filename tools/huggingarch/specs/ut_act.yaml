model:
- name: resid_lambdas
  op: parameter_vector
  dims:
    dim: '12'
  weight_axes:
  - &id001
    replicated: true
- name: x0_lambdas
  op: parameter_vector
  dims:
    dim: '12'
  weight_axes:
  - *id001
- name: smear_lambda
  op: parameter_vector
  dims:
    dim: '1'
  weight_axes:
  - *id001
- name: backout_lambda
  op: parameter_vector
  dims:
    dim: '1'
  weight_axes:
  - *id001
- name: transformer.wte
  op: embedding
  boundary_role: input_embedding
  dims:
    n_vocab: n_vocab
    d_model: d_model
  weight_axes: &id002
  - *id001
  - replicated: true
  inputs:
  - input_ids
- name: embedding_norm
  op: rmsnorm_unscaled
  dims:
    dim: d_model
  inputs:
  - transformer.wte
- name: smear_current
  op: slice
  axis: 1
  dims:
    out: s_ctx - 1
    start: '1'
  inputs:
  - embedding_norm
- name: smear_previous
  op: slice
  axis: 1
  dims:
    out: s_ctx - 1
    start: '0'
  inputs:
  - embedding_norm
- name: smear_channels
  op: slice
  dims:
    in: d_model
    out: '24'
    start: '0'
  inputs:
  - smear_current
- name: smear_gate
  op: linear
  dims:
    in: '24'
    out: '1'
  weight_axes: *id002
  inputs:
  - smear_channels
- name: smear_sigmoid
  op: sigmoid
  dims:
    dim: '1'
  inputs:
  - smear_gate
- name: smear_scaled
  op: mul
  dims:
    dim: '1'
  inputs:
  - smear_sigmoid
  - smear_lambda
- name: smear_contribution
  op: mul
  dims:
    dim: d_model
  inputs:
  - smear_previous
  - smear_scaled
- name: smear_sum
  op: add
  dims:
    dim: d_model
  inputs:
  - smear_current
  - smear_contribution
- name: first_token
  op: slice
  axis: 1
  dims:
    out: '1'
    start: '0'
  inputs:
  - embedding_norm
- name: initial_hidden
  op: concat
  axis: 1
  dims:
    out: s_ctx
  inputs:
  - first_token
  - smear_sum
- name: value_embeds.1.weight
  op: parameter_tensor
  shape:
  - n_vocab
  - d_model
