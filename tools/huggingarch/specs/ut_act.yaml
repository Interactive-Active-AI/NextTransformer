dim_symbols:
  d_gate:
    kind: whole
    group: per_arch_one_offs
    meaning: Singleton per-head gate axis from gate.unsqueeze(-1) in CausalSelfAttention.forward
custom_ops:
  shared_linear:
    signature:
      x:
      - B
      - s_ctx
      - I
      weight:
      - O
      - I
    flops: 2 * B * s_ctx * I * O
    params: '0'
    shape_kind: axis_replace
    out_key: O
    couples_on:
    - I
    axis_use:
      I:
        category: contract
        param: sum
    formula: y = x @ weight.T
    description: Apply an explicit stored parameter matrix, permitting shared recurrent
      weights without counting another copy.
  shared_embedding_lookup:
    signature:
      reference:
      - B
      - s_ctx
      - D
      input_ids:
      - B
      - s_ctx
      table:
      - V
      - D
    flops: '0'
    params: '0'
    shape_kind: preserve
    couples_on:
    - V
    axis_use:
      V:
        category: route
        param: token_ids
        note: Integer row selection from the shared vocabulary table.
    formula: table[input_ids]; reference supplies output shape only
    description: Repeated indexed read from one physical Value Embedding table; table
      is an explicit shared parameter source.
  sinusoidal_depth_coordinates:
    signature:
      reference:
      - B
      - s_ctx
      - d_model
    flops: 6 * s_ctx * d_model
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: (sin/cos(position*10000**(-2i/width)) + sin/cos(loop*10000**(-2i/width)))
      broadcast across batch
    description: Source-native elementwise control operation without a registered
      equivalent.
  alive_select:
    signature:
      candidate:
      - B
      - s_ctx
      - d_model
      previous:
      - B
      - s_ctx
      - d_model
      alive:
      - B
      - s_ctx
      - '1'
    flops: B * s_ctx * d_model
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: where(alive,candidate,previous)
    description: Source-native elementwise control operation without a registered
      equivalent.
  act_weights_step:
    signature:
      probability:
      - B
      - s_ctx
      - '1'
      cumulative:
      - B
      - s_ctx
      - '1'
      alive:
      - B
      - s_ctx
      - '1'
    flops: 7 * B * s_ctx
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: stop=alive & (cumulative+p>=0.99); weight=where(stop,1-cumulative,p)*alive;
      cumulative_new=cumulative+weight; alive_new=alive & ~stop
    description: Source-native elementwise control operation without a registered
      equivalent.
  act_weights_final:
    signature:
      probability:
      - B
      - s_ctx
      - '1'
      cumulative:
      - B
      - s_ctx
      - '1'
      alive:
      - B
      - s_ctx
      - '1'
    flops: 5 * B * s_ctx
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: 'final loop: weight=(1-cumulative)*alive; cumulative_new=cumulative+weight;
      alive_new=false'
    description: Source-native elementwise control operation without a registered
      equivalent.
  act_alive_update:
    signature:
      probability:
      - B
      - s_ctx
      - '1'
      cumulative:
      - B
      - s_ctx
      - '1'
      alive:
      - B
      - s_ctx
      - '1'
    flops: 3 * B * s_ctx
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: alive & ~(cumulative+probability>=0.99)
    description: Source-native elementwise control operation without a registered
      equivalent.
  zero_like_scalar:
    signature:
      reference:
      - B
      - s_ctx
      - '1'
    flops: '0'
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: zeros_like(reference)
    description: Source-native elementwise control operation without a registered
      equivalent.
  one_like_scalar:
    signature:
      reference:
      - B
      - s_ctx
      - '1'
    flops: '0'
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: ones_like(reference), logical true
    description: Source-native elementwise control operation without a registered
      equivalent.
  zero_like_hidden:
    signature:
      reference:
      - B
      - s_ctx
      - d_model
    flops: '0'
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: zeros_like(reference)
    description: Source-native elementwise control operation without a registered
      equivalent.
  sinusoidal_depth_coordinates_1:
    signature:
      reference:
      - B
      - s_ctx
      - d_model
    flops: 6 * s_ctx * d_model
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: (sin/cos(position*10000**(-2i/width)) + sin/cos(1*10000**(-2i/width)))
      broadcast across batch
    description: Source-native elementwise control operation without a registered
      equivalent.
  sinusoidal_depth_coordinates_2:
    signature:
      reference:
      - B
      - s_ctx
      - d_model
    flops: 6 * s_ctx * d_model
    params: '0'
    shape_kind: preserve
    couples_on: []
    formula: (sin/cos(position*10000**(-2i/width)) + sin/cos(2*10000**(-2i/width)))
      broadcast across batch
    description: Source-native elementwise control operation without a registered
      equivalent.
  sinusoidal_depth_coordinates_3:
