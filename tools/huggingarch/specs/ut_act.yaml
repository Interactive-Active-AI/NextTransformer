  nextt_decoder__ve_short:
    role: block
    inputs:
    - x
    - ve
    - attn_weight_c_q
    - attn_weight_c_k
    - attn_weight_c_v
    - attn_weight_ve_gate
    - attn_weight_c_proj
    - mlp_weight_c_fc
    - mlp_weight_c_proj
