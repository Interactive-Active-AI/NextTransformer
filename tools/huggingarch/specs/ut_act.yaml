# Fixed spec for custom:nextt-ut_act
# Scope: source full-sequence evaluation: all max_loops=3 core passes; per-token alive masks, accumulated ACT weights, epsilon=.01; no runtime pruning
# Checkpoint unavailable; do not mark checkpoint_validated or valid true.
# Constants: backout_negative=-1; logit_div15=1/15; logit_mul15=15; inverse split-half RoPE theta=100000.
match:
  model_id:
  - custom:nextt-ut_act
  model_type:
  - nexttransformer_ut_act
dims:
  d_model: config.hidden_size
  n_heads: 12
  n_kv_heads: 12
  d_gate: 1
  d_head: 128
  d_ffn: 6144
  n_vocab: 32768
  n_layers: 12
  s_max: 2048
model_inputs:
  input_ids:
    kind: tokens
blocks:
  nextt_attention:
    role: attention
    cache:
      family: GQA
      entries:
      - node: k_scale
        kind: kv
      - node: v_heads
        kind: kv
    graph:
      c_q:
        op: shared_linear
        in:
        - x
        - weight_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: shared_linear
        in:
        - x
        - weight_c_k
        dims:
          I: d_model
          O: d_model
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: shared_linear
        in:
        - x
        - weight_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      scores:
        op: attention_score
        in:
        - q_scale
        - k_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      probabilities:
        op: softmax
        in: scores
        dims:
          n_heads: n_heads
      weighted_values:
        op: attention_apply
        in:
        - probabilities
        - v_heads
        dims:
          n_heads: n_heads
          d_head: d_head
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: shared_linear
        in:
        - merge_heads
        - weight_c_proj
        dims:
          I: d_model
          O: d_model
    outputs:
    - c_proj
    inputs:
    - x
    - weight_c_q
    - weight_c_k
    - weight_c_v
    - weight_c_proj
  nextt_ffn:
    role: ffn_dense
    graph:
      c_fc:
        op: shared_linear
        in:
        - x
        - weight_c_fc
        dims:
          I: d_model
          O: d_ffn
      relu:
        op: relu
        in: c_fc
        dims:
          dim: d_ffn
      square:
        op: mul
        in:
        - relu
        - relu
        dims:
          dim: d_ffn
      c_proj:
        op: shared_linear
        in:
        - square
        - weight_c_proj
        dims:
          I: d_ffn
          O: d_model
    outputs:
    - c_proj
    inputs:
    - x
    - weight_c_fc
    - weight_c_proj
  nextt_attention_ve:
    role: attention
    inputs:
    - x
    - ve
    - weight_c_q
    - weight_c_k
    - weight_c_v
    - weight_ve_gate
    - weight_c_proj
    cache:
      family: GQA
      entries:
      - node: k_scale
        kind: kv
      - node: v_mixed
        kind: kv
    graph:
      c_q:
        op: shared_linear
        in:
        - x
        - weight_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: shared_linear
        in:
        - x
        - weight_c_k
        dims:
          I: d_model
          O: d_model
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: shared_linear
        in:
        - x
        - weight_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      gate_channels:
        op: slice
        in: x
        dims:
          in: d_model
          out: '12'
          start: '0'
      ve_gate:
        op: shared_linear
        in:
        - gate_channels
        - weight_ve_gate
        dims:
          I: '12'
          O: n_heads
      gate_sigmoid:
        op: sigmoid
        in: ve_gate
        dims:
          dim: n_heads
      gate3:
        op: scale_const
        formula: 3 * x
        in: gate_sigmoid
        dims:
          in: n_heads
      gate_heads:
        op: head_split
        in: gate3
        dims:
          n_heads: n_heads
          d_head: d_gate
      ve_heads:
        op: head_split
        in: ve
        dims:
          n_heads: n_heads
          d_head: d_head
      gated_ve:
        op: mul
        in:
        - ve_heads
        - gate_heads
        dims:
          dim: d_head
      v_mixed:
        op: add
        in:
        - v_heads
        - gated_ve
        dims:
          dim: d_head
      scores:
        op: attention_score
        in:
        - q_scale
        - k_scale
        dims:
          n_heads: n_heads
          d_head: d_head
      probabilities:
        op: softmax
        in: scores
        dims:
          n_heads: n_heads
      weighted_values:
        op: attention_apply
        in:
        - probabilities
        - v_mixed
        dims:
          n_heads: n_heads
          d_head: d_head
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: shared_linear
        in:
        - merge_heads
        - weight_c_proj
        dims:
          I: d_model
          O: d_model
    outputs:
    - c_proj
  nextt_attention_short:
    role: attention
    cache:
      family: SWA
      entries:
      - node: k_scale_window
        kind: kv
      - node: v_heads_window
        kind: kv
    graph:
      c_q:
        op: shared_linear
        in:
        - x
        - weight_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: shared_linear
        in:
        - x
        - weight_c_k
        dims:
          I: d_model
          O: d_model
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: shared_linear
        in:
        - x
        - weight_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      scores:
        op: swa_attention_score
        in:
        - q_scale
        - k_scale_window
        dims:
          n_heads: n_heads
          d_head: d_head
          s_window: '513'
      probabilities:
        op: swa_softmax
        in: scores
        dims:
          n_heads: n_heads
          s_window: '513'
      weighted_values:
        op: swa_attention_apply
        in:
        - probabilities
        - v_heads_window
        dims:
          n_heads: n_heads
          d_head: d_head
          s_window: '513'
      merge_heads:
        op: head_merge
        in: weighted_values
        dims:
          n_heads: n_heads
          d_head: d_head
      c_proj:
        op: shared_linear
        in:
        - merge_heads
        - weight_c_proj
        dims:
          I: d_model
          O: d_model
      k_scale_window:
        op: sliding_window_kv
        in: k_scale
        dims:
          s_window: '513'
      v_heads_window:
        op: sliding_window_kv
        in: v_heads
        dims:
          s_window: '513'
    outputs:
    - c_proj
    inputs:
    - x
    - weight_c_q
    - weight_c_k
    - weight_c_v
    - weight_c_proj
  nextt_attention_ve_short:
    role: attention
    inputs:
    - x
    - ve
    - weight_c_q
    - weight_c_k
    - weight_c_v
    - weight_ve_gate
    - weight_c_proj
    cache:
      family: SWA
      entries:
      - node: k_scale_window
        kind: kv
      - node: v_mixed_window
        kind: kv
    graph:
      c_q:
        op: shared_linear
        in:
        - x
        - weight_c_q
        dims:
          I: d_model
          O: d_model
      q_heads:
        op: head_split
        in: c_q
        dims:
          n_heads: n_heads
          d_head: d_head
      c_k:
        op: shared_linear
        in:
        - x
        - weight_c_k
        dims:
          I: d_model
          O: d_model
      k_heads:
        op: head_split
        in: c_k
        dims:
          n_heads: n_heads
          d_head: d_head
      c_v:
        op: shared_linear
        in:
        - x
        - weight_c_v
        dims:
          I: d_model
          O: d_model
      v_heads:
        op: head_split
        in: c_v
        dims:
          n_heads: n_heads
          d_head: d_head
      q_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: q_heads
        dims:
          dim: d_head
      q_norm:
        op: rmsnorm_unscaled
        in: q_rope
        dims:
          dim: d_head
      q_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: q_norm
        dims:
          in: d_head
      k_rope:
        op: rope
        formula: Inverse RoPE; split-half pairing; theta=100000
        in: k_heads
        dims:
          dim: d_head
      k_norm:
        op: rmsnorm_unscaled
        in: k_rope
        dims:
          dim: d_head
      k_scale:
        op: scale_const
        formula: y = 1.2 * x
        in: k_norm
        dims:
          in: d_head
      gate_channels:
        op: slice
        in: x
        dims:
          in: d_model
          out: '12'
          start: '0'
      ve_gate:
        op: shared_linear
        in:
        - gate_channels
        - weight_ve_gate
        dims:
          I: '12'
          O: n_heads
      gate_sigmoid:
        op: sigmoid
        in: ve_gate
        dims:
          dim: n_heads
      gate3:
        op: scale_const
        formula: 3 * x
        in: gate_sigmoid
        dims:
          in: n_heads
      gate_heads:
        op: head_split
        in: gate3
        dims:
          n_heads: n_heads
          d_head: d_gate
      ve_heads:
        op: head_split
        in: ve
        dims:
          n_heads: n_heads
          d_head: d_head
      gated_ve:
        op: mul
        in:
        - ve_heads
        - gate_heads
        dims:
          dim: d_head
      v_mixed:
        op: add
        in:
        - v_heads
        - gated_ve
        dims:
          dim: d_head
      scores:
        op: swa_attention_score
        in:
        - q_scale
        - k_scale_window
        dims:
