- name: final_norm
  op: rmsnorm_unscaled
  dims:
    dim: d_model
  inputs:
  - trunk
- name: lm_head
  op: linear
  boundary_role: output_head
  dims:
    in: d_model
    out: n_vocab
  weight_axes: *id001
  inputs:
  - final_norm
- name: logit_div15
  op: scale_const
  dims:
    in: n_vocab
  inputs:
  - lm_head
- name: logit_tanh
  op: tanh
  dims:
    dim: n_vocab
  inputs:
  - logit_div15
- name: logit_mul15
  op: scale_const
  dims:
    in: n_vocab
  inputs:
  - logit_tanh
custom_ops:
  nt_hc_alpha:
    signature:
      x:
      - B
      - s_ctx
      - N
      - D
      weight:
      - D
      - A
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - s_ctx
      - N
      - A
    flops: 2*B*s_ctx*N*D*A
    params: '0'
    couples_on:
    - D
    axis_use:
      D:
        category: route
        note: Explicit source contraction/normalization
    formula: normalized streams @ dynamic_alpha (stored [D,N+1])
    description: Atomic parameter-free operation. All projections and parameter tensors
      are separate nodes.
  nt_hc_mix:
    signature:
      alpha:
      - B
      - s_ctx
      - N
      - A
      streams:
      - B
      - s_ctx
      - N
      - D
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - s_ctx
      - A
      - D
    flops: 2*B*s_ctx*N*A*D
    params: '0'
    couples_on:
    - N
    axis_use:
      N:
        category: route
        note: Explicit source contraction/normalization
    formula: einsum btjk,btjd -> btkd; alpha transpose mixes original streams
    description: Atomic parameter-free operation. All projections and parameter tensors
      are separate nodes.
  nt_mhc_projection:
    signature:
      flat:
      - B
      - s_ctx
      - ND
      weight:
      - ND
      - A
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - s_ctx
      - A
    flops: 2*B*s_ctx*ND*A
    params: '0'
    couples_on:
    - ND
    axis_use:
      ND:
        category: route
        note: Explicit source contraction/normalization
    formula: flattened streams @ projection (stored [N*D,N*N+2*N])
    description: Atomic parameter-free operation. All projections and parameter tensors
      are separate nodes.
  nt_mhc_maps:
    signature:
      logits:
      - B
      - s_ctx
      - A
      gates:
      - 3
      bias:
      - A
    shape_kind: preserve
    secondary_outputs:
      pre:
      - B
      - s_ctx
      - N
      post:
      - B
      - s_ctx
      - N
      res:
      - B
      - s_ctx
      - N
      - N
    flops: B*s_ctx*(2*A+8*N+I*(12*N*N+4*N))
    params: '0'
    couples_on:
    - A
    axis_use:
      A:
        category: route
        note: Explicit source contraction/normalization
    formula: split; pre=sigmoid(g0*lpre+bpre); post=2sigmoid(g1*lpost+bpost); res=exp(logits
      after I column then row log-Sinkhorn normalizations)
    description: Atomic parameter-free operation. All projections and parameter tensors
      are separate nodes.
  nt_hc_read:
    signature:
      streams:
      - B
      - s_ctx
      - N
      - D
      weights:
      - B
      - s_ctx
      - N
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - s_ctx
      - D
    flops: 2*B*s_ctx*N*D
    params: '0'
    couples_on:
    - N
    axis_use:
      N:
        category: route
        note: Explicit source contraction/normalization
    formula: einsum btj,btjd -> btd
    description: Atomic parameter-free operation. All projections and parameter tensors
      are separate nodes.
  nt_hc_write:
    signature:
      mixed:
      - B
      - s_ctx
      - N
      - D
      output:
      - B
      - s_ctx
      - D
      weights:
      - B
      - s_ctx
      - N
    shape_kind: preserve
    secondary_outputs:
      value:
      - B
      - s_ctx
      - N
      - D
    flops: 2*B*s_ctx*N*D
    params: '0'
    couples_on: []
    axis_use: {}
    formula: mixed+weights[...,None]*output[:,:,None]
    description: Atomic parameter-free operation. All projections and parameter tensors
      are separate nodes.
