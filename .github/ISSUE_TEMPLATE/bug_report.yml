name: Bug report
description: Something in the code, the results, the website or the documentation is wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, configuration and the full error output.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit or release, Python and PyTorch versions.
