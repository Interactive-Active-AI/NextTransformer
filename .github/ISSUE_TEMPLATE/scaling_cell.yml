name: T3 scaling study
description: Coordinate an implementation, cost proof or planned training run.
title: "[Scaling] T3 cell "
labels: [scaling]
body:
  - type: markdown
    attributes:
      value: |
        Review the [2K contribution guide](https://interactive-active-ai.github.io/NextTransformer/docs/scaling/contribute/) and the T3 design manifest in `configs/scaling/t3.json`.
  - type: input
    id: cell
    attributes:
      label: Cell ID
      placeholder: dense-T3-L20
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Contribution
      options:
        - Implementation or cost proof
        - Training a verified configuration
        - Audit or analysis
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Identify the implementation, its verification status and any resources needed.
    validations:
      required: true
