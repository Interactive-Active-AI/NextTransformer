name: New method proposal
description: Propose an architecture to add as a plugin, before implementing it.
labels: [new-method]
body:
  - type: input
    id: name
    attributes:
      label: Method
      description: Name, and the paper or repository it comes from.
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Mechanism
      description: What changes relative to the shared shell, and which plugin hooks it needs.
    validations:
      required: true
  - type: textarea
    id: shared
    attributes:
      label: Shared code
      description: Does it need any change outside its own plugin folder? If so, which and why.
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Who implements it, whether a formal run is planned, and any open questions about the cost accounting.
