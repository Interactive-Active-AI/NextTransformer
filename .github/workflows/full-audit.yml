name: Full audit
# Maintainer tool: re-audit cost proofs with the PyTorch build the proofs record (the audit runs on CPU).
# For a pull request, use ref `refs/pull/<number>/head`. The regenerated configurations and proofs are
# uploaded as an artifact; the maintainer reviews the comparison and commits them to the pull request.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, commit, or refs/pull/<number>/head
        required: true
        default: main
      methods:
        description: Method ids separated by spaces (empty = every configuration whose proof is stale)
        required: false
        default: ""

permissions:
  contents: read

env:
  CUDA_VISIBLE_DEVICES: ""
  TORCH_COMPILE_DISABLE: "1"
  OMP_NUM_THREADS: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Audit environment
        run: |
          uv sync --frozen --extra gpu
          uv run python -c "import torch; print('torch', torch.__version__)"
      - name: Re-audit
        env:
          METHODS: ${{ inputs.methods }}
        run: |
          methods="$METHODS"
          if [ -z "$methods" ]; then
            methods=$(uv run python -m nexttransformer.protocol.fingerprint --all | awk '/needs a new audit|no per-method/ {print $1}' | xargs || true)
          fi
          if [ -z "$methods" ]; then echo "Every configuration matches its proof."; exit 0; fi
          echo "Re-auditing: $methods"
          mkdir -p before && cp -r configs before/
          uv run python -m nexttransformer.protocol.calibrate --methods $methods --reuse-configs configs \
            --output configs --results "evidence/costs/audit-${{ github.run_id }}" --cache .audit-cache --workers 4
          uv run python - <<'PY'
          import json, pathlib
          rows = []
          for new in sorted(pathlib.Path("configs").rglob("*.json")):
              old = pathlib.Path("before")/new
              if not old.exists() or old.read_text() == new.read_text():
                  continue
              a, b = json.loads(old.read_text())["calibration"], json.loads(new.read_text())["calibration"]
              rows.append(f"| {new.stem} | {a['flops_per_token']:.6e} | {b['flops_per_token']:.6e} | {b['relative_error']:+.4%} |")
          summary = ["| Method | FLOPs/token before | after | vs SSSL |", "|---|---:|---:|---:|", *rows]
          print("\n".join(summary))
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(summary) + "\n")
          PY
          uv run python -m nexttransformer.protocol.fingerprint --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ github.run_id }}
          path: |
            configs/
            evidence/costs/audit-${{ github.run_id }}/
          if-no-files-found: ignore
