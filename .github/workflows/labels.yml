name: Labels
# Labels a pull request from its changed files. Runs the base branch's code only; the pull request's code
# is never checked out or executed here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed.txt
          PYTHONPATH=. python - <<'PY'
          import os, subprocess
          from nexttransformer.checks.changes import classify
          paths = open("changed.txt").read().split()
          result = classify(paths)
          wanted = {"needs-audit": bool(result["affected"]), "contract": bool(result["contract"])}
          for label, on in wanted.items():
              flag = "--add-label" if on else "--remove-label"
              subprocess.run(["gh", "pr", "edit", os.environ["PR"], "--repo", os.environ["REPO"], flag, label], check=False)
          if result["affected"]:
              print("published methods whose fingerprinted files changed:", ", ".join(result["affected"]))
          PY
