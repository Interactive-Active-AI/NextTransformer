name: Pages
# Builds the observatory (site root) and the documentation (/docs/) into one GitHub Pages deployment.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            docs/package-lock.json
      - name: Website
        working-directory: website
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: npm ci && npm run build
      - name: Documentation
        working-directory: docs
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
        run: npm ci && npm run build
      - name: Assemble
        run: |
          mkdir -p _site/docs
          cp -r website/dist/. _site/
          cp -r docs/dist/. _site/docs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
