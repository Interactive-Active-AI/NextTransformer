name: Full tests
# Slow tests (full-size cost-audit reproductions, multi-rank data layouts) and the bitwise check against
# the base branch. They run when a maintainer labels a pull request `full-ci`, on demand, and after
# every merge into main.
on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  NANOCHAT_DTYPE: float32
  TORCH_COMPILE_DISABLE: "1"
  OMP_NUM_THREADS: "1"

jobs:
  slow:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - name: Slow tests
        run: uv run python -m pytest -q -m slow -n auto --dist worksteal --durations=20
      - name: Every method is bitwise identical to the base branch
        if: github.event_name == 'pull_request'
        run: uv run python -m nexttransformer.checks.golden --base "origin/${{ github.base_ref }}"
